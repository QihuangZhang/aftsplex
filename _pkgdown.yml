url: https://qihuangzhang.github.io/aftsplex/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#3d405b"     # StaGILL TwilightIndigo
    base_font: {google: "Source Sans Pro"}
    heading_font: {google: "Source Sans Pro"}
    code_font: {google: "JetBrains Mono"}

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

home:
  sidebar:
    structure: [links, articles, license, citation, authors]
    components:
      articles:
        title: Articles
        text: |
          - [Get started](articles/quickstart.html)
          - [Applied example: daily LPA (minute / time-ratio scale)](articles/applied-lpa.html)
          - [Simulation study: Oracle vs Naive vs SIMEX](articles/simulation-study.html)
          - [Sensitivity analysis: spline degrees of freedom](articles/sensitivity-df.html)

reference:
  - title: Data-generating process
    desc: Helpers for the simulation studies used in the manuscript.
    contents:
      - f_true
      - build_sigma_u
      - sigma_u_for_reliability
      - generate_aft_data

  - title: Phase 1 — Measurement-error calibration
    desc: Multivariate ME model and the GLS combiner.
    contents:
      - fit_me_calibration
      - gls_combine
      - extract_surrogate_cols

  - title: Phase 2 — AFT-spline fitting and SIMEX
    desc: The estimator pipeline.
    contents:
      - fit_aft_spline
      - predict_curve
      - simex_aft_spline
      - summary.simex_aft_spline
      - plot.simex_aft_spline

  - title: Inference — two-stage bootstrap
    contents:
      - two_stage_bootstrap
      - summary.two_stage_bootstrap

  - title: Evaluation and visualisation
    contents:
      - compute_ise
      - plot_curves
      - stagill_palette
      - method_colors

articles:
  - title: Get started
    navbar: ~
    contents:
      - quickstart
  - title: Practical workflows
    navbar: ~
    contents:
      - applied-lpa
      - simulation-study
      - sensitivity-df
      - coverage-diagnostics
  - title: Troubleshooting
    navbar: ~
    contents:
      - faq
